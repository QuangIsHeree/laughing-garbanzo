name: Fetch Roblox Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual testing from the Actions tab

permissions:
  contents: write # Required so the workflow can commit version.json

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Roblox API
        run: python fetch.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update version.json" && git push)
