<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Roblox API Raw</title>
  <style>
    body { background: #0d1117; color: #c9d1d9; font-family: monospace; padding: 20px; }
    pre { white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <pre id="raw">Loading...</pre>
  <script>
    fetch('./version.json?t=' + Date.now())
      .then(res => res.text())
      .then(text => document.getElementById('raw').textContent = text)
      .catch(err => document.getElementById('raw').textContent = 'Error: ' + err);
  </script>
</body>
</html>
